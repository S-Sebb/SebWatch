name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev libgl-dev
      - name: Check
        run: scripts/check
      - name: Logs
        if: failure()
        run: tail -n 100 build/logs/*.log
