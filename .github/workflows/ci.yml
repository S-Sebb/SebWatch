name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Slint's winit backend and femtovg renderer: fonts and keyboard layouts.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev desktop-file-utils
      - name: Check
        run: scripts/check
      - name: Install round trip
        run: scripts/test-install
      - name: Logs
        if: failure()
        run: tail -n 100 target/logs/*.log
